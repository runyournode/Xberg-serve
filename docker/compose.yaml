# xberg-serve -- two profiles built by .github/workflows/docker-publish.yaml
# and published to ghcr.io/runyournode/xberg-serve.
#
#   docker compose -f docker/compose.yaml up -d
#
# No .env file: nothing here is a secret, so every tunable value is a
# literal below. Only the thread-pool cap ([concurrency].max_threads) lives
# in the matching mount_config/<profile>.toml -- host/port stay `serve` CLI
# flags and CORS/upload limits stay env vars (see that file's comment for
# why [server] can't go in config.toml too).
#
# Air-gap: both images are self-contained once built (no runtime downloads --
# see docker/build/<version>/Dockerfile.* for what each profile bakes in).
# Pull them on a connected machine / let CI push them, then `docker save` /
# `scp` / `docker load` onto the air-gapped host if it has no registry access.

services:
  xberg-ultralight:
    image: ghcr.io/runyournode/xberg-serve:main-ultralight
    container_name: xberg-ultralight
    ports:
      - "8083:8000"
    environment:
      # xberg conf that cannot be defined in config.toml or in serve arg
      RUST_LOG: info
      # HTTP request global concurrency,
      XBERG_MAX_CONCURRENT_REQUESTS: 16  # default: 2 x CPUs, clamped to [4, 32]
      # Max size (default: 104857600 = 100 MB)
      XBERG_MAX_REQUEST_BODY_BYTES: 204857600
      XBERG_MAX_MULTIPART_FIELD_BYTES: 204857600
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
    command:
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--config"
      - "/config/config.toml"
    volumes:
      - ./mount_config/ultralight.toml:/config/config.toml:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    # Security
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
     # Limit cpu+ram here
    deploy:
      resources:
        limits:
          cpus: 8
          memory: 2g

    healthcheck:
      test: ["CMD", "/usr/local/bin/xberg-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s



  xberg-ocrlight:
    image: ghcr.io/runyournode/xberg-serve:main-ocrlight
    container_name: xberg-ocrlight
    ports:
      - "8083:8000"
    environment:
      # xberg conf that cannot be defined in config.toml or in serve arg
      RUST_LOG: info
      # HTTP request global concurrency,
      XBERG_MAX_CONCURRENT_REQUESTS: 16  # default: 2 x CPUs, clamped to [4, 32]
      # Max size (default: 104857600 = 100 MB)
      XBERG_MAX_REQUEST_BODY_BYTES: 204857600
      XBERG_MAX_MULTIPART_FIELD_BYTES: 204857600
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
    command:
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--config"
      - "/config/config.toml"
    volumes:
      - ./mount_config/ocrlight.toml:/config/config.toml:ro
    tmpfs:  # ocr would rasterize, give some space
      - /tmp:size=2g,mode=1777
    # Security
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Limit cpu+ram here
    deploy:
      resources:
        limits:
          cpus: 8
          memory: 3g

    healthcheck:
      test: [ "CMD", "/usr/local/bin/xberg-healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
